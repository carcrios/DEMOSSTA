<style>
.au-t{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;} .au-t button{border:1.5px solid var(--n-300);background:var(--paper);border-radius:var(--r-pill);padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;min-height:40px;}
.au-t button.on{background:var(--tinta);color:var(--paper);border-color:var(--tinta);}
.au-l{margin:0;padding:0;list-style:none;} .au-l li{border-bottom:1px solid var(--n-150);padding:8px 0;} .au-l button{all:unset;cursor:pointer;display:block;width:100%;}
.au-l .t{font-weight:700;} .au-d{display:grid;grid-template-columns:minmax(120px,30%) 1fr;gap:4px 10px;font-size:var(--fs-menor);} .au-d dt{font-weight:700;color:var(--tenue,var(--ink-muted));}
</style>

<body>
<main class="wrap">
<div class="screen active">
  <div class="hdr"><div class="marca-titulo"><span class="marca" role="img" aria-label="Logo de la empresa"></span><div><div class="eyebrow">Solo lectura</div><h1>Consulta del auditor</h1><p id="auSub">Verificando el enlace…</p></div></div></div>
  <div id="auMsg"></div>
  <div class="card" id="auCard" hidden><div class="au-t" id="auTabs" role="tablist"></div><div class="field"><label for="auQ">Buscar</label><input type="search" id="auQ" data-no-ac placeholder="Ej.: extintor, 2026-10"></div><div id="auLista"></div></div>
</div>
</main>
<script src="dialogo.js"></script>
<script src="empresa.js"></script>
<script src="empresa-motor.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="iconos-emoji.js"></script>
<script src="sgsst-ui.js"></script>
<script>
/* v162 · Página del auditor: entra con el enlace que le dio la empresa (sin usuario), ve solo los módulos permitidos,
   no puede cambiar nada y cada consulta queda en la bitácora con su nombre. */
const $ = (id)=> document.getElementById(id), A = new URLSearchParams(location.search).get('a') || '';
const NOMBRE = { trabajador: 'Personal habilitado', induccion: 'Inducciones', inspeccion: 'Inspecciones', equipo: 'Equipos', proginsp: 'Programa de inspecciones', reporte: 'Reportes e investigaciones', accion: 'Plan de acción',
  plananual: 'Plan anual', mes: 'Indicadores del mes', politica: 'Política y objetivos', peligro: 'Matriz de peligros', revmatriz: 'Revisiones de la matriz', legal: 'Matriz legal', comite: 'Comités', reunion: 'Actas de reunión',
  entrega: 'Entregas de EPP', eppcargo: 'Matriz de EPP', emergencia: 'Plan de emergencias', simulacro: 'Simulacros', documento: 'Listado maestro', auditoria: 'Auditorías', revision: 'Revisión por la dirección', evid0312: 'Evidencias 0312', contratista: 'Contratistas', proveedor: 'Proveedores' };
let tipos = [], tipo = '', filas = [];
const q = (params)=> SGSST.consultar(Object.assign({ auditor: A }, params));
async function iniciar(){
  if (!A) { $('auSub').textContent = 'Falta el enlace.'; return; }
  let r; try { r = await q({ action: 'auditorInfo' }); } catch (e) { r = { ok: false, error: 'Sin señal.' }; }
  if (!r.ok) { $('auSub').textContent = 'Enlace no válido'; $('auMsg').innerHTML = '<div class="aviso mal">' + esc(r.error || '') + '</div>'; return; }
  tipos = r.tipos; $('auSub').textContent = r.empresa + ' · ' + r.nombre + ' · disponible hasta el ' + UI.corta(r.vence);
  $('auCard').hidden = false;
  $('auTabs').innerHTML = tipos.map((t)=> '<button type="button" role="tab" data-t="' + esc(t) + '">' + esc(NOMBRE[t] || t) + '</button>').join('');
  $('auTabs').addEventListener('click', (e)=> { const b = e.target.closest('[data-t]'); if (b) abrir(b.dataset.t); });
  $('auQ').addEventListener('input', pintar);
  if (tipos.length) abrir(tipos[0]);
}
async function abrir(t){
  tipo = t; $('auTabs').querySelectorAll('[data-t]').forEach((b)=> { b.classList.toggle('on', b.dataset.t === t); b.setAttribute('aria-selected', b.dataset.t === t); });
  $('auLista').innerHTML = '<div class="empty">Cargando…</div>';
  const r = await q({ action: 'list', tipo: t }); filas = (r.rows || []).sort((a, b)=> String(b.fecha || '').localeCompare(String(a.fecha || ''))); pintar();
}
function pintar(){
  const s = UI.norm($('auQ').value).trim(), l = filas.filter((x)=> !s || UI.norm([x.titulo, x.estado, x.fecha, JSON.stringify(x.resumen)].join(' ')).includes(s));
  $('auLista').innerHTML = l.length ? '<ul class="au-l">' + l.slice(0, 300).map((x)=> '<li><button type="button" data-id="' + esc(x.id) + '"><div class="t">' + esc(x.titulo || x.id) + '</div><div class="m">' + esc([x.id, UI.corta(String(x.fecha || '').slice(0, 10)), x.estado].filter(Boolean).join(' · ')) + '</div></button><div data-det></div></li>').join('') + '</ul>' : '<div class="empty">Sin registros.</div>';
}
document.addEventListener('click', async (e)=> {
  const b = e.target.closest('.au-l [data-id]'); if (!b) return; const box = b.parentElement.querySelector('[data-det]');
  if (box.innerHTML) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="empty">Abriendo…</div>';
  const r = await q({ action: 'doc', id: b.dataset.id }); if (!r.ok) { box.innerHTML = '<div class="aviso mal">' + esc(r.error || '') + '</div>'; return; }
  const d = r.doc || {}, plano = (v)=> Array.isArray(v) ? v.map(plano).filter(Boolean).join(' · ') : v && typeof v === 'object' ? Object.keys(v).map((k)=> k + ': ' + plano(v[k])).join('; ') : String(v == null ? '' : v);
  box.innerHTML = '<dl class="au-d">' + Object.keys(d).filter((k)=> !/firma|foto|imagen|^adjuntos$|sello|^_/.test(k)).map((k)=> { const v = plano(d[k]); return v && !/^data:/.test(v) ? '<dt>' + esc(k) + '</dt><dd>' + esc(v.slice(0, 600)) + '</dd>' : ''; }).join('') + '</dl>';
});
iniciar();
</script>
</body>
</html>
