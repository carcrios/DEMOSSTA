<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();
const $ = UI.$, G = INFORME.graf, C = G.COLOR;
/* v155 · Programas de vigilancia epidemiológica (PVE / SVE), módulo propio.
   - El programa (tipo «sve»): objetivo, responsable, metas y actividades programadas / ejecutadas.
   - Las personas (tipo «pvecaso»): entran por examen médico (el médico las remite: «¿Debe ingresar a un PVE?»),
     por exposición del cargo o a mano; cada una con su clasificación, seguimientos y próxima evaluación.
   - Indicadores: población, prevalencia, incidencia, cobertura de evaluación, seguimientos vencidos y cumplimiento.
   Nunca se escribe el diagnóstico: eso es de la historia clínica (Res. 1843 de 2025). Solo SST y administrador. */
const PROGRAMAS = ['Osteomuscular (desórdenes musculoesqueléticos)', 'Conservación auditiva', 'Riesgo psicosocial', 'Protección respiratoria', 'Riesgo cardiovascular', 'Visual', 'Riesgo químico', 'Riesgo biológico', 'Radiaciones ionizantes', 'Otro'];
const CLASES = ['Expuesto sin alteraciones', 'Sospechoso / sintomático', 'Caso (lo confirmó el médico)'];
const ACT_TIPICAS = { osteo: ['Encuesta de síntomas osteomusculares', 'Inspección de puestos de trabajo', 'Escuela de espalda', 'Pausas activas'], audit: ['Audiometrías', 'Sonometría / dosimetría', 'Entrega y uso de protectores auditivos', 'Capacitación en conservación auditiva'],
  psico: ['Aplicación de la batería', 'Talleres de manejo del estrés', 'Intervención de dominios en riesgo alto'], resp: ['Espirometrías', 'Mediciones de material particulado', 'Pruebas de ajuste del respirador'], visual: ['Optometrías / visiometrías', 'Inspección de iluminación', 'Pausas visuales'],
  cardio: ['Tamizaje de riesgo cardiovascular', 'Actividad física', 'Charlas de hábitos saludables'], quim: ['Monitoreo biológico', 'Inspección de almacenamiento químico', 'Capacitación SGA'], bio: ['Esquema de vacunación', 'Inspección de bioseguridad'], rad: ['Dosimetría personal', 'Revisión de blindajes'] };
let rows = [], actual = null;
const de = (t)=> rows.filter((x)=> x.tipo === t);
function pveClave(t){ const n = UI.norm(t || ''); return /osteo|muscul/.test(n) ? 'osteo' : /audit|ruido/.test(n) ? 'audit' : /respirat|pulmon/.test(n) ? 'resp' : /psicosoc/.test(n) ? 'psico' :
  /visual|ocular/.test(n) ? 'visual' : /cardio/.test(n) ? 'cardio' : /quimic/.test(n) ? 'quim' : /biologic/.test(n) ? 'bio' : /ionizante|radiacion/.test(n) ? 'rad' : n.trim(); }
const nombreProg = (r)=> r.programa === 'Otro' && r.programaOtro ? r.programaOtro : (r.programa || 'Programa');
const listaDe = (v)=> Array.isArray(v) ? v : String(v || '').split(/[,;|]/).map((x)=> x.trim()).filter(Boolean);
const cedK = (c)=> String(c || '').replace(/\D/g, '');
const personasDe = (sveId)=> de('pvecaso').filter((x)=> x.resumen.sveId === sveId);
const anio = UI.hoy().slice(0, 4);

/** Indicadores de un programa. */
function indicadores(prog){
  const r = prog.resumen || prog, ps = personasDe(prog.id), act = ps.filter((x)=> x.resumen.estado !== 'Egresado'), h = UI.hoy();
  const casos = act.filter((x)=> x.resumen.clasificacion && x.resumen.clasificacion !== CLASES[0]);
  const nuevos = ps.filter((x)=> x.resumen.clasificacion !== CLASES[0] && String(x.resumen.fechaIngreso || '').slice(0, 4) === anio);
  const evaluados = act.filter((x)=> String(x.resumen.ultimoSeguimiento || '').slice(0, 4) === anio);
  const vencidos = act.filter((x)=> x.resumen.proximaEvaluacion && x.resumen.proximaEvaluacion < h);
  const pc = (a, b)=> b ? Math.round(a * 1000 / b) / 10 : null;
  const ap = Number(r.actProgramadas) || 0, ae = Number(r.actEjecutadas) || 0;
  return { expuestos: act.length, casos: casos.length, confirmados: act.filter((x)=> x.resumen.clasificacion === CLASES[2]).length, sospechosos: act.filter((x)=> x.resumen.clasificacion === CLASES[1]).length,
    prevalencia: pc(casos.length, act.length), incidencia: pc(nuevos.length, act.length), nuevos: nuevos.length, cobertura: pc(evaluados.length, act.length), evaluados: evaluados.length,
    vencidos: vencidos.length, egresados: ps.length - act.length, cumplimiento: ap ? Math.round(ae * 100 / ap) : null, ap, ae,
    metaPrev: r.metaPrevalencia === '' || r.metaPrevalencia == null ? null : Number(r.metaPrevalencia), metaCob: r.metaCobertura === '' || r.metaCobertura == null ? 90 : Number(r.metaCobertura) };
}
const fmt1 = (v)=> v === null || v === undefined ? '—' : String(v).replace('.', ',') + ' %';
function tiles(I){
  const sem = (v, bien, mal, alReves)=> v === null ? '' : alReves ? (v <= bien ? 'ok' : v >= mal ? 'mal' : 'amar') : (v >= bien ? 'ok' : v <= mal ? 'mal' : 'amar');
  return [
    ['Población en el programa', String(I.expuestos), I.egresados ? I.egresados + ' egresados' : 'personas activas', ''],
    ['Prevalencia', fmt1(I.prevalencia), I.casos + ' casos (' + I.sospechosos + ' sospechosos, ' + I.confirmados + ' confirmados)' + (I.metaPrev !== null ? ' · meta ≤ ' + I.metaPrev + ' %' : ''), I.metaPrev !== null ? sem(I.prevalencia, I.metaPrev, I.metaPrev * 1.5, true) : ''],
    ['Incidencia ' + anio, fmt1(I.incidencia), I.nuevos + ' casos nuevos en el año', I.nuevos ? 'amar' : 'ok'],
    ['Cobertura de evaluación ' + anio, fmt1(I.cobertura), I.evaluados + ' de ' + I.expuestos + ' con seguimiento en el año · meta ' + I.metaCob + ' %', sem(I.cobertura, I.metaCob, I.metaCob * 0.7)],
    ['Seguimientos vencidos', String(I.vencidos), 'próxima evaluación pasada', I.vencidos ? 'mal' : 'ok'],
    ['Cumplimiento de actividades', I.cumplimiento === null ? '—' : I.cumplimiento + ' %', I.ap ? I.ae + ' de ' + I.ap + ' ejecutadas' : 'sin actividades programadas', sem(I.cumplimiento, 90, 70)]];
}
const tilesHtml = (I)=> '<div class="pv-kpis">' + tiles(I).map((t)=> '<div class="pv-k ' + t[3] + '"><div class="n">' + esc(t[0]) + '</div><div class="v">' + esc(t[1]) + '</div><div class="f">' + esc(t[2]) + '</div></div>').join('') + '</div>';

/* v157 · Del peligro al programa: los cargos expuestos según la matriz de peligros (GTC 45) son la población
   del programa, y el profesiograma de esos cargos debe pedir la prueba de vigilancia. */
const PELIGRO_PVE = { audit: /ruido/, osteo: /biomec|postura|movimiento repetitivo|manipulaci[oó]n (manual )?de cargas|esfuerzo/, psico: /psicosocial/, resp: /material particulado|polvo|humo|gases|vapores|neblina|fibras/,
  quim: /qu[ií]mico/, bio: /biol[oó]gico|virus|bacteria|hongo/, visual: /iluminaci|pantalla|deslumbr|radiaci[oó]n no ionizante/, rad: /radiaci[oó]n ionizante|rayos x|gamma/, cardio: /^$/ };
const PRUEBA_PVE = { audit: /audiometr/i, osteo: /osteomuscular/i, resp: /espirometr/i, visual: /visiometr|optometr/i, quim: /qu[ií]mico|bei|indicadores biol/i, psico: /psicol[oó]g/i };
function cargosExpuestos(prog){
  const re = PELIGRO_PVE[pveClave(nombreProg(prog.resumen))]; if (!re) return [];
  const out = new Set();
  de('peligro').forEach((x)=> { const r = x.resumen, t = UI.norm([r.clasificacion, r.subtipo, r.peligro].join(' '));
    if (!re.test(t)) return; String(r.cargos || '').split(/\s*[,;]\s*/).map((c)=> c.trim()).filter(Boolean).forEach((c)=> out.add(c)); });
  return [...out];
}
function expuestosSinIncluir(prog){
  const cs = cargosExpuestos(prog).map(UI.norm), ya = new Set(personasDe(prog.id).map((x)=> cedK(x.resumen.cedula)));
  return de('trabajador').filter((t)=> t.resumen.activo !== false && cs.includes(UI.norm(t.resumen.cargo)) && !ya.has(cedK(t.resumen.cedula)));
}
function profesiogramaSinPrueba(prog){
  const re = PRUEBA_PVE[pveClave(nombreProg(prog.resumen))]; if (!re) return [];
  return cargosExpuestos(prog).filter((c)=> { const p = de('cargo').find((x)=> UI.norm(x.resumen.nombre) === UI.norm(c)); return !p || !re.test(String(p.resumen.examenes || '') + ' ' + JSON.stringify(p.resumen.enfasis || '')); });
}
/** Personas remitidas por examen médico a un programa que aún no están en él. */
function remitidosSinIncluir(prog){
  const clave = pveClave(nombreProg(prog.resumen)), ya = new Set(personasDe(prog.id).map((x)=> cedK(x.resumen.cedula))), out = {};
  de('examen').sort((a, b)=> String(a.resumen.fecha).localeCompare(String(b.resumen.fecha))).forEach((x)=> { const s = x.resumen;
    if (s.pveIngresa !== 'Sí' || s.tipoExamen === 'Egreso' || !listaDe(s.pve).some((p)=> pveClave(p) === clave)) return;
    const k = cedK(s.cedula) || UI.norm(s.nombre); if (ya.has(k)) return; out[k] = { nombre: s.nombre, cedula: s.cedula, cargo: s.cargo, fecha: s.fecha, examenId: x.id, tipo: s.tipoExamen }; });
  return Object.values(out);
}

async function cargar(){
  if (UI.avisoServidor($('avisoSrv'))) { $('lista').innerHTML = ''; return; }
  const rol = Sesion.rol();
  if (rol && rol !== 'admin' && rol !== 'sst') { $('lista').innerHTML = '<div class="aviso info">🔒 La vigilancia epidemiológica tiene datos de salud: solo la ven el administrador y el área SST.</div>'; return; }
  const r = await SGSST.listar('sve,pvecaso,examen,trabajador,peligro,cargo');
  UI.avisoCopia($('avisoCopia'), r);
  rows = r.rows || []; pintarLista();
  if (actual) { const p = de('sve').find((x)=> x.id === actual.id); if (p) { try { p.doc = await Registros.abrir(p.id); } catch (e) {} actual = p; pintarProg(); } }
}
function pintarLista(){
  const progs = de('sve').sort((a, b)=> (a.resumen.estado === 'Cerrado') - (b.resumen.estado === 'Cerrado') || nombreProg(a.resumen).localeCompare(nombreProg(b.resumen)));
  const todos = progs.filter((p)=> p.resumen.estado !== 'Cerrado').map((p)=> ({ p, I: indicadores(p) }));
  const pend = progs.reduce((a, p)=> a + remitidosSinIncluir(p).length, 0);
  const huerf = (()=> { const claves = new Set(progs.map((p)=> pveClave(nombreProg(p.resumen)))), out = {};
    de('examen').forEach((x)=> { if (x.resumen.pveIngresa !== 'Sí') return; listaDe(x.resumen.pve).forEach((n)=> { const c = pveClave(n); if (!claves.has(c)) out[c] = n; }); }); return out; })();
  $('lista').innerHTML =
    '<div class="fila-btn"><button type="button" class="btn amber" id="nProg">+ Programa de vigilancia</button><button type="button" class="btn ghost" id="pdfGen">🖨️ Informe de los PVE (PDF)</button></div>' +
    (pend ? '<div class="aviso amar">Hay <b>' + pend + '</b> persona(s) remitidas por examen médico que aún no están en su programa. Ábrelo y pulsa «Agregar» en «Remitidos por examen».</div>' : '') +
    (Object.keys(huerf).length ? '<div class="aviso amar">Exámenes remiten a programas que aún no existen: ' + Object.keys(huerf).map((c)=> '<button type="button" class="btn ghost mini" data-crear="' + esc(huerf[c]) + '">Crear «' + esc(huerf[c]) + '»</button>').join(' ') + '</div>' : '') +
    (todos.length ? '<div class="card"><h2>Indicadores de los programas</h2><div class="pv-grafs">' +
      '<div class="pv-g"><h3>Prevalencia por programa (%)</h3>' + G.barrasH(todos.map((x)=> ({ n: nombreProg(x.p.resumen), v: x.I.prevalencia || 0 }))) + '</div>' +
      '<div class="pv-g"><h3>Personas por clasificación</h3>' + G.anillo([{ n: 'Expuestos sin alteraciones', v: todos.reduce((a, x)=> a + x.I.expuestos - x.I.casos, 0), color: C.ok }, { n: 'Sospechosos', v: todos.reduce((a, x)=> a + x.I.sospechosos, 0), color: C.alerta }, { n: 'Casos confirmados', v: todos.reduce((a, x)=> a + x.I.confirmados, 0), color: C.mal }], { sub: 'personas' }) + '</div>' +
      '<div class="pv-g"><h3>Cobertura de evaluación ' + anio + ' (%)</h3>' + G.barrasH(todos.map((x)=> ({ n: nombreProg(x.p.resumen), v: x.I.cobertura || 0 }))) + '</div>' +
      '<div class="pv-g"><h3>Cumplimiento de actividades (%)</h3>' + G.barrasH(todos.map((x)=> ({ n: nombreProg(x.p.resumen), v: x.I.cumplimiento || 0 }))) + '</div></div></div>' : '') +
    '<div class="card"><h2>Programas</h2>' + (progs.length ? progs.map((p)=> { const I = indicadores(p), rem = remitidosSinIncluir(p).length;
      return '<button type="button" class="pv-per" data-prog="' + esc(p.id) + '"><div><div class="t">' + esc(nombreProg(p.resumen)) + '</div><div class="m">' + I.expuestos + ' persona(s) · prevalencia ' + fmt1(I.prevalencia) + ' · cobertura ' + fmt1(I.cobertura) + (I.vencidos ? ' · <b class="u-mal">' + I.vencidos + ' seguimiento(s) vencido(s)</b>' : '') + (rem ? ' · <b>' + rem + ' remitido(s) por incluir</b>' : '') + '</div></div><span class="chip ' + (p.resumen.estado === 'Cerrado' ? 'gris' : 'ok') + '">' + esc(p.resumen.estado || 'Activo') + '</span></button>'; }).join('')
      : '<div class="empty">Aún no hay programas. Crea uno por cada peligro prioritario (ruido, cargas, psicosocial…).</div>') + '</div>' +
    '<p class="ayuda">Aquí no se escriben diagnósticos: la persona entra al programa con su clasificación (expuesto, sospechoso o caso) y el diagnóstico queda en la historia clínica del médico (Res. 1843 de 2025).</p>';
  $('nProg').addEventListener('click', ()=> editarProg({ id: SGSST.nuevoId('SVE'), nuevo: true, programa: PROGRAMAS[0], estado: 'Activo', fechaInicio: UI.hoy(), metaCobertura: 90, actividadesPlan: [] }));
  $('pdfGen').addEventListener('click', pdfGeneral);
  $('lista').querySelectorAll('[data-prog]').forEach((b)=> b.addEventListener('click', ()=> abrirProg(b.dataset.prog)));
  $('lista').querySelectorAll('[data-crear]').forEach((b)=> b.addEventListener('click', ()=> { const n = b.dataset.crear, p = PROGRAMAS.find((x)=> x !== 'Otro' && pveClave(x) === pveClave(n));
    editarProg({ id: SGSST.nuevoId('SVE'), nuevo: true, programa: p || 'Otro', programaOtro: p ? '' : n, estado: 'Activo', fechaInicio: UI.hoy(), metaCobertura: 90, actividadesPlan: [] }); }));
}
function mostrar(id){ document.querySelectorAll('.screen').forEach((s)=> s.classList.toggle('active', s.id === id)); window.scrollTo(0, 0); }
document.addEventListener('click', (e)=> { if (e.target.closest('[data-volver]')) { e.preventDefault(); actual = null; mostrar('scrLista'); pintarLista(); } });
async function abrirProg(id){ actual = de('sve').find((x)=> x.id === id); if (!actual) return; try { actual.doc = await Registros.abrir(id); } catch (e) {} pintarProg(); mostrar('scrProg'); }
let tabP = 'personas';
function pintarProg(){
  const p = actual, r = p.resumen, I = indicadores(p), ps = personasDe(p.id).sort((a, b)=> (a.resumen.estado === 'Egresado') - (b.resumen.estado === 'Egresado') || CLASES.indexOf(b.resumen.clasificacion) - CLASES.indexOf(a.resumen.clasificacion) || String(a.resumen.nombre).localeCompare(String(b.resumen.nombre)));
  const rem = remitidosSinIncluir(p);
  $('pTitulo').textContent = nombreProg(r); $('pSub').textContent = (r.responsable ? 'Responsable: ' + r.responsable + ' · ' : '') + 'desde ' + UI.corta(r.fechaInicio || '') + ' · ' + (r.estado || 'Activo');
  const porClase = CLASES.map((c, i)=> ({ n: c.replace(/ \(.*/, ''), v: ps.filter((x)=> x.resumen.estado !== 'Egresado' && x.resumen.clasificacion === c).length, color: [C.ok, C.alerta, C.mal][i] }));
  const meses = Array.from({ length: 12 }, (_, i)=> anio + '-' + ('0' + (i + 1)).slice(-2));
  $('prog').innerHTML =
    '<div class="card">' + tilesHtml(I) + '<div class="pv-grafs">' +
      '<div class="pv-g"><h3>Personas por clasificación</h3>' + G.anillo(porClase, { sub: 'personas' }) + '</div>' +
      '<div class="pv-g"><h3>Ingresos al programa ' + anio + '</h3>' + G.barras(meses.map((m)=> ({ et: INFORME.etiquetaMes(m), v: ps.filter((x)=> String(x.resumen.fechaIngreso || '').slice(0, 7) === m).length })), { dec: 0 }) + '</div>' +
      (I.ap ? '<div class="pv-g"><h3>Actividades: programadas y ejecutadas</h3>' + G.barrasPar(((p.doc && p.doc.actividadesPlan) || []).map((a)=> ({ et: String(a.actividad).slice(0, 10), a: Number(a.programadas) || 0, b: Number(a.ejecutadas) || 0 })), { na: 'programadas', nb: 'ejecutadas' }) + '</div>' : '') +

    if (typeof r === 'string') { msg.textContent = r; return; }
    m.cerrar(); UI.toast('✓ Programa guardado'); await cargar(); if (d.nuevo) abrirProg(d.id);
  });
}
/* ── PDF ── */
function hojaPrograma(p, docP){
  const r = p.resumen, I = indicadores(p), ps = personasDe(p.id), act = ps.filter((x)=> x.resumen.estado !== 'Egresado');
  const porClase = CLASES.map((c, i)=> ({ n: c.replace(/ \(.*/, ''), v: act.filter((x)=> x.resumen.clasificacion === c).length, color: [C.ok, C.alerta, C.mal][i] }));
  return UI.cabecera('SG-PVE', 'PROGRAMA DE VIGILANCIA EPIDEMIOLÓGICA: ' + nombreProg(r).toUpperCase(), 'Corte ' + UI.corta(UI.hoy()) + ' · ' + (r.estado || 'Activo')) +
    UI.seccion('DATOS DEL PROGRAMA', UI.tablaDatos([['Responsable', r.responsable || '—'], ['Inicio', UI.corta(r.fechaInicio || '') || '—'], ['Objetivo', (docP && docP.objetivo) || '—']])) +
    UI.seccion('INDICADORES', '<table><tr>' + tiles(I).map((t)=> '<td style="width:16.6%;vertical-align:top;border-left:3pt solid ' + ({ ok: '#15803d', amar: '#b45309', mal: '#b42318' }[t[3]] || '#94a3b8') + ';"><div style="font-size:6.8pt;font-weight:bold;">' + esc(t[0]) + '</div><div style="font-size:14pt;font-weight:bold;">' + esc(t[1]) + '</div><div style="font-size:6.5pt;">' + esc(t[2]) + '</div></td>').join('') + '</tr></table>' +
      '<p style="font-size:6.8pt;">Prevalencia = casos (sospechosos + confirmados) ÷ población activa × 100. Incidencia = casos nuevos del año ÷ población × 100. Cobertura = personas con seguimiento en el año ÷ población × 100.</p>') +
    UI.seccion('GRÁFICAS', '<table style="table-layout:fixed;width:100%;"><tr><td style="width:50%;">' + G.anillo(porClase, { sub: 'personas' }) + '</td><td>' + (I.ap ? G.barrasPar(((docP && docP.actividadesPlan) || []).map((a)=> ({ et: String(a.actividad).slice(0, 10), a: a.programadas, b: a.ejecutadas })), { na: 'programadas', nb: 'ejecutadas' }) : 'Sin actividades programadas.') + '</td></tr></table>') +
    (docP && (docP.actividadesPlan || []).length ? UI.seccion('ACTIVIDADES', '<table><tr><th>Actividad</th><th style="width:15%;">Programadas</th><th style="width:15%;">Ejecutadas</th><th style="width:15%;">Cumplimiento</th></tr>' + docP.actividadesPlan.map((a)=> '<tr><td>' + esc(a.actividad) + '</td><td>' + a.programadas + '</td><td>' + a.ejecutadas + '</td><td>' + (a.programadas ? Math.round(Math.min(a.ejecutadas, a.programadas) * 100 / a.programadas) + ' %' : '—') + '</td></tr>').join('') + '</table>') : '') +
    UI.seccion('PERSONAS EN EL PROGRAMA (' + act.length + ')', act.length ? '<table><tr><th>Trabajador</th><th>Cédula</th><th>Cargo / área</th><th>Clasificación</th><th>Ingresó (origen)</th><th>Último seguimiento</th><th>Próxima evaluación</th></tr>' +
      act.map((x)=> { const s = x.resumen; return '<tr><td>' + esc(s.nombre) + '</td><td>' + esc(s.cedula || '') + '</td><td>' + esc([s.cargo, s.area].filter(Boolean).join(' · ')) + '</td><td>' + esc(String(s.clasificacion || '').replace(/ \(.*/, '')) + '</td><td>' + esc(UI.corta(s.fechaIngreso || '')) + ' (' + esc(s.origen || '') + ')</td><td>' + esc(s.ultimoSeguimiento ? UI.corta(s.ultimoSeguimiento) : '—') + '</td><td>' + esc(s.proximaEvaluacion ? UI.corta(s.proximaEvaluacion) : '—') + '</td></tr>'; }).join('') + '</table>' : '<table><tr><td>Sin personas.</td></tr></table>') +
    '<p style="font-size:7pt;">Documento con datos de salud: uso exclusivo del área SST y del médico del trabajo (Ley 1581 de 2012; Res. 1843 de 2025). No contiene diagnósticos: quedan en la historia clínica que custodia el prestador.</p>';
}
async function pdfPrograma(p){ const d = await Registros.abrir(p.id); UI.imprimir([hojaPrograma(p, d)], true); }
async function pdfGeneral(){
  const progs = de('sve').filter((p)=> p.resumen.estado !== 'Cerrado'); if (!progs.length) { UI.toast('No hay programas activos.', 'mal'); return; }
  const docs = await Promise.all(progs.map((p)=> Registros.abrir(p.id).catch(()=> null)));
  const res = UI.cabecera('SG-PVE', 'INFORME DE LOS PROGRAMAS DE VIGILANCIA EPIDEMIOLÓGICA', 'Corte ' + UI.corta(UI.hoy())) +
    UI.seccion('RESUMEN', '<table><tr><th>Programa</th><th>Población</th><th>Prevalencia</th><th>Incidencia ' + anio + '</th><th>Cobertura</th><th>Seguimientos vencidos</th><th>Cumplimiento</th></tr>' +
      progs.map((p)=> { const I = indicadores(p); return '<tr><td>' + esc(nombreProg(p.resumen)) + '</td><td>' + I.expuestos + '</td><td>' + fmt1(I.prevalencia) + '</td><td>' + fmt1(I.incidencia) + '</td><td>' + fmt1(I.cobertura) + '</td><td>' + I.vencidos + '</td><td>' + (I.cumplimiento === null ? '—' : I.cumplimiento + ' %') + '</td></tr>'; }).join('') + '</table>');
  UI.imprimir([res].concat(progs.map((p, i)=> hojaPrograma(p, docs[i]))), true);
}
window.addEventListener('outbox-enviado', ()=> cargar());
cargar();
</script>
