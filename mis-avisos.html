<body>
<div class="wrap">
<div class="screen active">
  <div class="hdr">
    <a class="back" href="index.html">← Atrás</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="Logo de la empresa"></span><div><div class="eyebrow">Tu usuario</div>
    <h1>Tus avisos por correo</h1>
    <p>Elige cuándo te llegan los pendientes</p></div></div>
  </div>
  <div id="avisoSrv"></div><div id="msg"></div>
  <div class="card" id="cardAvisos" hidden></div>
</div>
</div>
<script src="dialogo.js"></script>
<script src="empresa.js"></script>
<script src="empresa-motor.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="iconos-emoji.js"></script>
<script src="sgsst-ui.js"></script>
<script>
OfflineBanner.init();
const $ = UI.$;
const ROLES = { admin: 'Administrador', sst: 'SST', supervisor: 'Supervisor / campo', comite: 'Integrante de comité', consulta: 'Solo consulta' };
/* v162 · Cada persona elige cómo recibe los avisos (el administrador además define los de cada rol). */
const FREC = [['diario', 'Cada día, lo que vence hoy y mañana'], ['semanal', 'Los lunes, lo de la semana'], ['criticos', 'Solo lo vencido'], ['no', 'No quiero correos']];
async function cargarMisAvisos(){
  let j; try { j = await SGSST.consultar({ action: 'misAvisos' }); } catch (e) { return; } if (!j.ok) return;
  const c = $('cardAvisos'); c.hidden = false;
  c.innerHTML = '<h2>Tus avisos por correo</h2>' + (j.correo ? '' : '<div class="aviso amar">Tu usuario no tiene correo: pídele al administrador que lo agregue para recibir avisos.</div>') +
    '<div class="field"><label for="avFrec">Cuándo</label><select id="avFrec">' + FREC.map(([k, t])=> '<option value="' + k + '"' + (j.pref.frec === k ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></div>' +
    '<label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" id="avFinde"' + (j.pref.finde ? ' checked' : '') + '> También sábados y domingos</label>' +
    '<button type="button" class="btn ghost u-mt8" id="avGuardar">Guardar</button><span class="status-msg" id="avMsg"></span>' +
    (j.roles ? '<h3 class="u-mt10">Por rol (lo que reciben quienes no han elegido)</h3><div class="grid2">' + Object.keys(ROLES).map((r)=> '<div class="field"><label for="avR' + r + '">' + esc(ROLES[r]) + '</label><select id="avR' + r + '" data-rol="' + r + '">' + FREC.map(([k, t])=> '<option value="' + k + '"' + ((j.roles[r] || {}).frec === k || (!j.roles[r] && k === 'diario') ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></div>').join('') + '</div><button type="button" class="btn ghost" id="avRoles">Guardar por rol</button><span class="status-msg" id="avRMsg"></span>' : '');
  $('avGuardar').addEventListener('click', async ()=> { const r = await SGSST.enviar({ action: 'guardarMisAvisos', frec: $('avFrec').value, finde: $('avFinde').checked }, null, { sinCola: true }); $('avMsg').textContent = r.ok ? ' ✓ Guardado' : ' ' + (r.error || 'No se pudo'); });
  if ($('avRoles')) $('avRoles').addEventListener('click', async ()=> { const roles = {}; c.querySelectorAll('[data-rol]').forEach((s)=> { roles[s.dataset.rol] = s.value; });
    const r = await SGSST.enviar({ action: 'avisosPorRol', roles }, null, { sinCola: true }); $('avRMsg').textContent = r.ok ? ' ✓ Guardado' : ' ' + (r.error || 'No se pudo'); });
}

(async ()=> { if (UI.avisoServidor($('avisoSrv'))) return;
  if (!(Sesion.modo() && Sesion.yo())) { $('msg').innerHTML = '<div class="aviso info">Entra con tu usuario para elegir tus avisos.</div>'; Sesion.pedir && Sesion.pedir(); return; }
  cargarMisAvisos(); })();
</script>
</body>
</html>
