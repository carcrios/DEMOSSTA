<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();
const $ = UI.$, G = INFORME.graf, C = G.COLOR;
/* v158 · Análisis y alertas: cruces de los datos del portal que no se ven registro por registro.
   Alertas de patrón, controles de la matriz sin evidencia, costo de la accidentalidad, calificación de
   contratistas, tendencia de la Res. 0312, charlas sugeridas por lo que pasa, personas sin actividad,
   vencimientos del mes y eficacia de las acciones. */
const TIPOS = 'aprobrec,evid0312,custodiahc,empresa,documento,comite,reunion,plananual,trabajador,induccion,politica,auditoria,rendicion,legal,reporte,proveedor,contratista,cambio,perfil,sve,cargo,examen,inspeccion,residuo,aspecto,mes,peligro,revmatriz,sustancia,medicion,programa,equipo,eppcargo,entrega,emergencia,simulacro,revision,accion,solrepo,pvecaso,dotacion';
const TABS = [['alertas', '⚠ Alertas'], ['controles', 'Controles'], ['costos', 'Costos'], ['contratistas', 'Contratistas'], ['r0312', 'Res. 0312'], ['charlas', 'Charlas sugeridas'], ['personas', 'Sin actividad'], ['vence', 'Vencimientos'], ['eficacia', 'Eficacia'], ['datos', 'Datos por depurar']];
let rows = [], tab = 'alertas', esSst = false, perfil = {}, evHoy = null, ev30 = null, plantilla = '';
const de = (t)=> rows.filter((x)=> x.tipo === t);
const hoy = UI.hoy(), menos = (d)=> Festivos.sumarDias(hoy, -d), mas = (d)=> Festivos.sumarDias(hoy, d);
const cedK = (c)=> String(c || '').replace(/\D/g, '');
const norm = (t)=> String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
const kpi = (v, n, f, c)=> '<div class="an-k ' + (c || '') + '"><div class="n">' + esc(n) + '</div><div class="v">' + esc(v) + '</div>' + (f ? '<div class="f">' + esc(f) + '</div>' : '') + '</div>';
const li = (t, m, c)=> '<li><div class="t">' + t + (c ? ' <span class="chip ' + c[0] + '">' + esc(c[1]) + '</span>' : '') + '</div>' + (m ? '<div>' + m + '</div>' : '') + '</li>';
const card = (h, cuerpo, ayuda)=> '<div class="card"><h2>' + h + '</h2>' + (ayuda ? '<p class="ayuda u-mtn4">' + ayuda + '</p>' : '') + cuerpo + '</div>';
const lista = (items, vacio)=> items.length ? '<ul class="an-l">' + items.join('') + '</ul>' : '<div class="empty">' + vacio + '</div>';
const areaDeTrab = ()=> { const m = {}; de('trabajador').forEach((x)=> { m[cedK(x.resumen.cedula)] = x.resumen; }); return m; };

async function cargar(){
  if (UI.avisoServidor($('avisoSrv'))) { $('panel').innerHTML = ''; return; }
  const rol = Sesion.rol(); esSst = !Sesion.modo() || !Sesion.yo() || ['admin', 'sst'].includes(rol);
  const r = await SGSST.listar(TIPOS);
  UI.avisoCopia($('avisoCopia'), r); rows = r.rows || [];
  try { await Habilitacion.cargar(); } catch (e) {}
  const pf = rows.find((x)=> x.id === 'EMPRESA-PERFIL');
  perfil = (pf && await SGSST.doc('EMPRESA-PERFIL')) || UI.perfilInstalacion() || {};
  const grupo = Number(perfil.grupo0312) || 60; plantilla = grupo === 60 ? 'RES0312' : 'RES0312_' + grupo;
  try { const items = PLANTILLAS_AUDITORIA[plantilla].items, ctx = (h)=> ({ rows, perfil, hoy: h, esSst, docDe: (id)=> SGSST.doc(id) });
    evHoy = await EVIDENCIAS.evaluar(items, ctx(hoy)); ev30 = await EVIDENCIAS.evaluar(items, ctx(mas(30))); } catch (e) { evHoy = ev30 = null; }
  pintarTabs(); pintar();
}
function pintarTabs(){
  const n = { alertas: alertas().length, controles: controles().filter((x)=> x.falta.length).length, personas: sinActividad().length, eficacia: eficacia().filter((x)=> x.volvio).length, datos: datosSucios().total };
  $('tabs').innerHTML = TABS.map(([k, t])=> '<button type="button" data-t="' + k + '" class="' + (tab === k ? 'on' : '') + '">' + t + (n[k] ? ' <span class="n">' + n[k] + '</span>' : '') + '</button>').join('');
}
$('tabs').addEventListener('click', (e)=> { const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t; pintarTabs(); pintar(); });
function pintar(){ $('panel').innerHTML = ({ alertas: pAlertas, controles: pControles, costos: pCostos, contratistas: pContratistas, r0312: p0312, charlas: pCharlas, personas: pPersonas, vence: pVence, eficacia: pEficacia, datos: pDatos })[tab](); enlazar(); }
function enlazar(){
  $('panel').querySelectorAll('[data-reabrir]').forEach((b)=> b.addEventListener('click', async ()=> {
    const id = b.dataset.reabrir, x = eficacia().find((y)=> y.a.id === id); if (!x) return;
    if (!await Dialogo.confirmar('¿Reabrir la acción? El problema volvió a reportarse ' + x.nuevos.length + ' vez(veces) después de cerrarla.')) return;
    const r = await SGSST.enviar({ action: 'parche', tipo: 'accion', id, campos: { estado: 'ABIERTA', fechaCompromiso: Festivos.sumarHabiles(hoy, 10) }, agregar: { seguimiento: { fecha: hoy, texto: 'Reabierta: no fue eficaz (el problema se volvió a reportar: ' + x.nuevos.map((n)=> n.id).join(', ') + ').', uid: 'efi-' + Date.now() } } });
    UI.toast(r.ok ? '✓ Acción reabierta' : Errores.texto('guardó', r), r.ok ? '' : 'mal'); if (r.ok) cargar(); }));
  if ($('cSal')) ['cSal', 'cInd'].forEach((id)=> $(id).addEventListener('change', ()=> { try { localStorage.setItem('ssta-an-' + id, $(id).value); } catch (e) {} pintar(); }));
}

/* ── 1 · Alertas de patrón ── */
function alertas(){
  const out = [], rep = de('reporte').filter((x)=> String(x.resumen.fecha) >= menos(30) && /Acto|Condici|Incidente|Accidente/.test(x.resumen.clase || ''));
  const g = {}; rep.forEach((x)=> { const k = norm(x.resumen.categoria || x.resumen.clase) + '|' + norm(x.resumen.lugar || x.resumen.centro); (g[k] = g[k] || []).push(x); });
  Object.keys(g).forEach((k)=> { const l = g[k]; if (l.length >= 3) out.push({ n: 'mal', t: l.length + ' reportes de «' + (l[0].resumen.categoria || l[0].resumen.clase) + '» en ' + (l[0].resumen.lugar || l[0].resumen.centro || 'el mismo lugar') + ' en 30 días', m: 'Ya no es un hecho aislado: revisa la causa común y el control en la matriz de peligros. ' + l.map((x)=> x.id).join(', '), href: 'reportes.html' }); });
  const insp = {}; de('inspeccion').filter((x)=> x.resumen.equipoId).sort((a, b)=> String(a.resumen.fecha).localeCompare(String(b.resumen.fecha))).forEach((x)=> { (insp[x.resumen.equipoId] = insp[x.resumen.equipoId] || []).push(x); });
  Object.keys(insp).forEach((id)=> { const l = insp[id].slice(-2); if (l.length === 2 && l.every((x)=> x.resumen.resultado === 'NO CONFORME')) { const eq = de('equipo').find((e)=> e.id === id);
    out.push({ n: 'mal', t: 'Equipo no conforme dos veces seguidas: ' + ((eq && (eq.resumen.codigo || eq.resumen.nombre)) || l[1].resumen.equipo || id), m: 'Lo que se corrigió no funcionó o no se corrigió. Considera sacarlo de uso o cambiarlo.', href: 'inspecciones.html' }); } });
  const sr = {}; de('solrepo').filter((x)=> String(x.resumen.fecha) >= menos(90)).forEach((x)=> { const k = cedK(x.resumen.cedula); (sr[k] = sr[k] || []).push(x); });
  Object.keys(sr).forEach((k)=> { const l = sr[k]; if (l.length >= 2) out.push({ n: 'amar', t: (l[0].resumen.nombre) + ': EPP dañado ' + l.length + ' veces en 90 días', m: 'Revisa si el EPP es el adecuado para la tarea, la talla o el uso. ' + l.map((x)=> x.resumen.elementosTexto).join(' · '), href: 'persona.html?ced=' + k }); });
  const ats = areaDeTrab(), les = {}; de('reporte').filter((x)=> x.resumen.lesionadoCc && String(x.resumen.fecha) >= menos(365)).forEach((x)=> { const k = cedK(x.resumen.lesionadoCc); (les[k] = les[k] || []).push(x); });
  Object.keys(les).forEach((k)=> { if (les[k].length >= 2) out.push({ n: 'mal', t: ((ats[k] || {}).nombre || les[k][0].resumen.lesionado || k) + ': ' + les[k].length + ' eventos con lesión en el año', m: 'Revisa su puesto, su capacitación y si entra a un programa de vigilancia.', href: 'persona.html?ced=' + k }); });
  const acc = de('accion').filter((x)=> x.estado !== 'CERRADA' && x.resumen.fechaCompromiso && x.resumen.fechaCompromiso < menos(30));
  if (acc.length >= 3) out.push({ n: 'amar', t: acc.length + ' acciones con más de 30 días de vencidas', m: 'El plan de acción se está quedando: reprograma con responsables o escálalo a la gerencia.', href: 'plan-accion.html' });
  return out;
}
function pAlertas(){ const l = alertas();
  return card('Alertas de patrón', lista(l.map((x)=> li(esc(x.t), esc(x.m) + (x.href ? ' <a href="' + esc(x.href) + '">Ver →</a>' : ''), [x.n === 'mal' ? 'mal' : 'pronto', x.n === 'mal' ? 'Atender' : 'Revisar'])), 'Sin patrones raros en los datos. 👍'),
    'Lo que se repite: el mismo reporte en el mismo lugar, el mismo equipo no conforme, la misma persona con EPP dañado o lesionada, acciones que se quedan.'); }

/* ── 3 · Controles de la matriz sin evidencia ── */
function controles(){
  const insp = de('inspeccion').filter((x)=> String(x.resumen.fecha) >= menos(60)), cats = insp.map((x)=> norm([x.resumen.categoria, x.resumen.equipo, x.resumen.lugar].join(' ')));
  const mant = de('equipo').filter((x)=> x.resumen.mantTipo && x.resumen.mantTipo !== 'No aplica');
  const matriz = de('eppcargo').map((x)=> ({ c: norm(x.resumen.cargo), e: norm(x.resumen.elementosTexto) }));
  return de('peligro').filter((x)=> /^(I|II)$/.test(String(x.resumen.nivel || '')) || /no acept/i.test(x.resumen.aceptabilidad || '') || x.resumen.controlesTexto).map((x)=> {
    const s = x.resumen, t = norm(s.controlesTexto + ' ' + (s.ctrlIndividuo || '')), falta = [], ok = [];
    if (/inspecci/.test(t)) { const pal = t.match(/inspecci[oó]n (?:de |del |a )?(?:la |los |las |el )?([a-z]{4,})/); const p = pal && pal[1];
      (p ? cats.some((c)=> c.includes(p.slice(0, 5))) : insp.length) ? ok.push('inspección' + (p ? ' de ' + p : '')) : falta.push('no hay inspecciones' + (p ? ' de «' + p + '»' : '') + ' en 60 días'); }
    if (/mantenimiento/.test(t)) (mant.some((e)=> !e.resumen.mantProximo || e.resumen.mantProximo >= hoy) ? ok.push('mantenimiento al día') : falta.push('no hay equipos con mantenimiento programado al día'));
    if (s.ctrlIndividuo) { const cs = String(s.cargos || '').split(/\s*[,;]\s*/).map(norm).filter(Boolean), el = norm(s.ctrlIndividuo).split(/[,;y]+/).map((w)=> w.trim().split(' ')[0]).filter((w)=> w.length > 3);
      const sinEpp = cs.filter((c)=> { const m = matriz.find((y)=> y.c === c); return !m || !el.every((w)=> m.e.includes(w.slice(0, 5))); });
      sinEpp.length ? falta.push('la matriz de EPP de ' + sinEpp.join(', ') + ' no incluye: ' + s.ctrlIndividuo) : cs.length && ok.push('EPP en la matriz de los cargos'); }
    return { x, falta, ok };
  }).filter((y)=> y.falta.length || y.ok.length);
}
function pControles(){ const l = controles(), f = l.filter((y)=> y.falta.length);
  return card('Controles de la matriz que no se evidencian', '<div class="an-kpis">' + kpi(String(f.length), 'Peligros con control sin evidencia', '', f.length ? 'mal' : 'ok') + kpi(String(l.length - f.length), 'Con controles evidenciados', '', 'ok') + '</div>' +
    lista(f.map((y)=> li(esc(y.x.resumen.peligro || y.x.titulo) + ' · ' + esc(y.x.resumen.proceso || ''), '<b>Falta:</b> ' + esc(y.falta.join('; ')) + (y.ok.length ? '<br>Sí hay: ' + esc(y.ok.join(', ')) : '') + ' <a href="peligros.html#' + esc(y.x.id) + '">Abrir →</a>', ['mal', 'Control no evidenciado'])), 'Todos los controles que el portal puede revisar tienen evidencia.'),
    'El portal lee los controles escritos en la matriz (inspecciones, mantenimiento y EPP) y busca su registro: inspecciones de los últimos 60 días, mantenimientos al día y el EPP en la matriz de EPP de los cargos expuestos.'); }

/* ── 4 · Costo de la accidentalidad ── */
function pCostos(){
  let sal = 0, ind = 4; try { sal = Number(localStorage.getItem('ssta-an-cSal')) || 0; ind = Number(localStorage.getItem('ssta-an-cInd')) || 4; } catch (e) {}
  const SMMLV = 1750905; if (!sal) sal = SMMLV * 1.5;
  const anio = hoy.slice(0, 4), at = de('reporte').filter((x)=> x.resumen.clase === 'Accidente de trabajo' && String(x.resumen.fecha).slice(0, 4) === anio);
  const dias = at.reduce((a, x)=> a + (Number(x.resumen.diasIncapacidad) || 0), 0), diario = sal / 30;
  // Los 2 primeros días de incapacidad los paga el empleador; desde el 3.º la ARL. Igual se pierde la producción de cada día.
  const directo = at.reduce((a, x)=> a + Math.min(2, Number(x.resumen.diasIncapacidad) || 0) * diario, 0), produccion = dias * diario, repo = de('solrepo').filter((x)=> String(x.resumen.fecha).slice(0, 4) === anio).length;
  const total = directo + produccion * ind;
  const $f = (v)=> '$' + Math.round(v).toLocaleString('es-CO');
  const porMes = Array.from({ length: 12 }, (_, i)=> anio + '-' + ('0' + (i + 1)).slice(-2)).map((m)=> { const l = at.filter((x)=> String(x.resumen.fecha).slice(0, 7) === m); return { et: INFORME.etiquetaMes(m), v: Math.round(l.reduce((a, x)=> a + (Number(x.resumen.diasIncapacidad) || 0), 0) * diario * (1 + ind) / 1000000 * 10) / 10 }; });
  return card('Costo estimado de la accidentalidad ' + anio,
    '<div class="grid2"><div class="field"><label for="cSal">Salario base promedio (mensual)</label><input type="number" id="cSal" value="' + Math.round(sal) + '"></div><div class="field"><label for="cInd">Costos ocultos por cada peso visible</label><select id="cInd">' + [2, 3, 4, 5].map((n)=> '<option' + (n === ind ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></div></div>' +
    '<div class="an-kpis">' + kpi(String(at.length), 'Accidentes de trabajo', dias + ' días de incapacidad', at.length ? 'mal' : 'ok') + kpi($f(directo), 'Lo que paga la empresa', 'los 2 primeros días de cada incapacidad') + kpi($f(produccion), 'Producción perdida', dias + ' días × salario diario') + kpi($f(total), 'Costo total estimado', 'directo + ocultos (reemplazos, investigación, daños, tiempo)', total ? 'mal' : 'ok') + '</div>' +
    '<div class="pv-g">' + G.barras(porMes, { dec: 1, titulo: 'Millones por mes' }) + '<p class="ayuda">Millones de pesos por mes (incluye los costos ocultos).</p></div>' +
    '<p class="ayuda">Además, ' + repo + ' reposición(es) de EPP por daño este año. Es una estimación para la gerencia: el salario y el factor de costos ocultos los pones tú (Heinrich y Bird usan de 4 a 1 hasta 10 a 1). No se usan los salarios reales de nadie.</p>'); }

/* ── 5 · Calificación por contratista ── */
function pContratistas(){
  const trab = de('trabajador').filter((x)=> x.resumen.activo !== false), porEmp = {}, empresaDe = areaDeTrab();
  trab.forEach((x)=> { const e = String(x.resumen.empresa || '').trim(); if (!e) return; (porEmp[norm(e)] = porEmp[norm(e)] || { n: e, t: [] }).t.push(x); });
  const reps = de('reporte').filter((x)=> String(x.resumen.fecha) >= menos(365));
  const filas = de('contratista').map((c)=> {
    const k = norm(c.resumen.nombre), g = porEmp[k] || { t: [] }, hab = g.t.filter((x)=> Habilitacion.revisar(x.resumen.cedula, 'general').estado === 'ok').length;
    const at = reps.filter((x)=> x.resumen.clase === 'Accidente de trabajo' && norm((empresaDe[cedK(x.resumen.lesionadoCc)] || {}).empresa) === k).length;
    const docs = c.resumen.docsVencidos ? 0 : c.resumen.docsFaltan ? 50 : 100, pHab = g.t.length ? Math.round(hab * 100 / g.t.length) : null, ev = Number(c.resumen.evalPuntaje) || null;
    const nota = Math.round(((pHab === null ? 70 : pHab) * 0.4 + docs * 0.3 + Math.max(0, 100 - at * 25) * 0.2 + (ev === null ? 70 : ev) * 0.1));
    return { c, n: g.t.length, pHab, docs, at, ev, nota };
  }).sort((a, b)=> a.nota - b.nota);
  return card('Calificación de contratistas', filas.length ? '<table class="tabla"><tr><th>Contratista</th><th>Personal habilitado</th><th>Documentos</th><th>AT (año)</th><th>Nota</th></tr>' + filas.map((f)=> '<tr><td><b>' + esc(f.c.resumen.nombre) + '</b><br><small>' + esc(f.c.resumen.servicio || '') + '</small></td><td>' + (f.pHab === null ? '—' : f.pHab + ' % de ' + f.n) + '</td><td>' + (f.docs === 100 ? 'Al día' : f.docs === 50 ? 'Faltan' : '<b class="u-mal">Vencidos</b>') + '</td><td>' + f.at + '</td><td><span class="chip ' + (f.nota >= 85 ? 'ok' : f.nota >= 70 ? 'pronto' : 'mal') + '">' + f.nota + '</span></td></tr>').join('') + '</table>' : '<div class="empty">No hay contratistas registrados.</div>',
    'Nota de 0 a 100: personal habilitado (40 %), documentos (30 %), accidentes del último año (20 %) y su última evaluación de desempeño (10 %). El personal se cruza por el nombre de la empresa en Personal habilitado.'); }

/* ── 6 · Res. 0312: hoy y en 30 días ── */
function p0312(){
  if (!evHoy) return card('Res. 0312', '<div class="empty">No se pudo calcular (¿sin señal?).</div>');
  const a = EVIDENCIAS.resumen(evHoy), b = EVIDENCIAS.resumen(ev30), baja = evHoy.filter((x, i)=> x.e === 'ok' && ev30[i] && ev30[i].e !== 'ok');
  const hist = de('mes').filter((x)=> x.resumen.pct0312 !== undefined && x.resumen.pct0312 !== '').sort((p, q)=> String(p.resumen.mes).localeCompare(String(q.resumen.mes))).slice(-12);

function pEficacia(){ const l = eficacia(), no = l.filter((x)=> x.volvio), si = l.filter((x)=> !x.volvio && x.madura), esp = l.filter((x)=> !x.volvio && !x.madura);

/* ── v159 · 12 · Datos por depurar ── */
const nk = (t)=> norm(t).replace(/[^a-z0-9ñ]/g, '');
function datosSucios(){
  const trab = de('trabajador'), out = { dup: [], nombres: [], inact: [], equipos: [], areas: [], total: 0 };
  const porCed = {}; trab.forEach((x)=> { const k = cedK(x.resumen.cedula); if (k) (porCed[k] = porCed[k] || []).push(x); });
  out.dup = Object.keys(porCed).filter((k)=> porCed[k].length > 1).map((k)=> porCed[k]);
  const porNom = {}; trab.forEach((x)=> { const k = nk(x.resumen.nombre); if (k.length > 8) (porNom[k] = porNom[k] || []).push(x); });
  out.nombres = Object.keys(porNom).filter((k)=> new Set(porNom[k].map((x)=> cedK(x.resumen.cedula))).size > 1).map((k)=> porNom[k]);
  const recientes = new Set(); ['entrega', 'induccion', 'solrepo', 'dotacion'].forEach((t)=> de(t).filter((x)=> String(x.resumen.fecha || x.fecha) >= menos(30)).forEach((x)=> recientes.add(cedK(x.resumen.cedula))));
  de('reporte').filter((x)=> String(x.resumen.fecha) >= menos(30)).forEach((x)=> recientes.add(cedK(x.resumen.lesionadoCc)));
  out.inact = trab.filter((x)=> x.resumen.activo === false && recientes.has(cedK(x.resumen.cedula)));
  out.equipos = de('equipo').filter((x)=> x.resumen.activo !== false && (!x.resumen.ultimaInspeccion || x.resumen.ultimaInspeccion < menos(90)));

  const oficiales = (typeof Areas !== 'undefined' ? Areas.lista() : []), usos = {};
  trab.concat(de('equipo')).forEach((x)=> { const a = String(x.resumen.area || '').trim(); if (!a) return; const k = nk(a); (usos[k] = usos[k] || {})[a] = (usos[k][a] || []).concat(x); });
  out.areas = Object.keys(usos).map((k)=> { const formas = Object.keys(usos[k]); const of = oficiales.find((o)=> nk(o) === k); return { k, formas, of, regs: [].concat(...formas.map((f)=> usos[k][f])) }; })
    .filter((g)=> g.formas.length > 1 || (g.of && g.formas[0] !== g.of) || (!g.of && oficiales.length && !oficiales.some((o)=> nk(o) === g.k)));

}

    return li('Área: ' + g.formas.map((f)=> '«' + esc(f) + '»').join(', '), g.regs.length + ' registro(s).' + (g.of ? '' : ' No está en la lista oficial de áreas.') + (g.formas.length > 1 || g.of ? ' <button type="button" class="btn-mini" data-unificar="' + esc(g.k) + '" data-a="' + esc(dest) + '">Unificar como «' + esc(dest) + '»</button>' : ' <a href="areas.html">Agregarla a las áreas →</a>'), ['pronto', 'Revisar']); });

}
/* v162 · Fusión de duplicados con historial: se deja la ficha con más datos, se le pasan los requisitos que le falten
   y las demás quedan INACTIVAS con «fusionada con …» (nada se borra; el historial de cada una sigue ahí). */
document.addEventListener('click', async (e)=> {

  const peso = (x)=> Object.keys(x.resumen.req || {}).length * 10 + (x.resumen.cargo ? 1 : 0) + (x.resumen.area ? 1 : 0);

document.addEventListener('click', async (e)=> {
